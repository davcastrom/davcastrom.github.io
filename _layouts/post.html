---
layout: default
---
{% if page.image %}
<p class="gallery-back"><a class="button secondary" href="{{ '/blog/' | relative_url }}">← Volver a la galería</a></p>
{% endif %}
<h1>{{ page.title }}</h1>
<p class="meta">{{ page.date | date_to_string }}</p>

{% if page.image %}
<figure class="post-photo">
  <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">
  <figcaption>© David Castro, {{ page.date | date: "%Y" }} · Todos los derechos reservados. Para reutilizar esta foto, contáctame.</figcaption>
</figure>
{% endif %}

<div class="post">
  {{ content }}
</div>

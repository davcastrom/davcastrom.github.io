<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="David Castro — plant physiology, biochemistry, and plant–microbiome interactions.">
		<title>{{ page.title | default: site.name }}</title>
		<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v=20261028-logo">
		{% include head-custom.html %}
	</head>
	<body>
		<header class="site-header">
			<div class="nav-wrap">
				<a class="brand" href="{{ '/' | relative_url }}" aria-label="David Castro — home"><img class="brand-symbol" src="{{ '/assets/images/dc-amanita-emblem.png' | relative_url }}?v=1" alt=""><span class="brand-copy"><strong>DC</strong><small>Plant science<br>&amp; fungal ecology</small></span></a>
				<nav class="site-nav" aria-label="Main navigation">
					<ul>
						<li><a href="{{ '/' | relative_url }}">Home</a></li>
						<li><a href="{{ '/#research' | relative_url }}">Research</a></li>
						<li><a href="{{ '/about/' | relative_url }}">About</a></li>
						<li><a href="{{ '/cv/' | relative_url }}">CV</a></li>
						<li><a href="{{ '/#publications' | relative_url }}">Publications</a></li>
						<li><a href="{{ '/blog/' | relative_url }}">Gallery</a></li>
					</ul>
				</nav>
			</div>
		</header>
		<main class="page-shell {% if page.url != '/' %}document-page{% endif %}">
			{{ content }}
		</main>
		<footer class="page-shell site-footer">
			<p>© {{ site.time | date: '%Y' }} David Castro · Plant science &amp; microbiome research</p>
			<p><a href="mailto:david.castro.moraga@gmail.com">Get in touch ↗</a></p>
		</footer>
	</body>
</html>
